name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    # The HACS action fetches hacs.json/manifest through the GitHub API, which
    # fails while this repository is private (HACS cannot install private repos
    # either). Skipped rather than merely non-blocking, so a red X here cannot
    # be mistaken for a real failure. Both lines disappear on their own the day
    # the repo goes public, and then the topics, the brand icon and a release
    # are what is left to do (see beolink/ha-intellipool for the full round).
    if: ${{ !github.event.repository.private }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt
      - run: pytest -q
